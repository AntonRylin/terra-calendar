name: Release desktop builds

# Builds Windows / macOS / Linux installers with Tauri and attaches them to a
# draft GitHub Release, including the signed updater artifacts + latest.json
# the auto-updater polls. Trigger by pushing a tag like `v0.4.0` (keep it in
# sync with the version in src-tauri/tauri.conf.json), or run manually.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           — updater signing key (tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password ("" if none)
# Optional repository variables (Settings → Secrets and variables → Variables):
#   VITE_GOOGLE_CLIENT_ID  — bakes Google sync into the build (docs/RELEASING.md §1)
#   VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY — enables accounts/cloud
#   VITE_BILLING_ENABLED   — set to "true" only when Stripe is live (docs/BILLING_SETUP.md)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest # Apple Silicon + Intel in one binary
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal build links both architectures.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BILLING_ENABLED: ${{ vars.VITE_BILLING_ENABLED }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Terra Calendar ${{ github.ref_name }}'
          releaseBody: 'See the commit history for changes. Download the installer for your platform below.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # tauri.ci.conf.json drops the local Windows-GNU WebView2Loader.dll
          # resource (CI builds with MSVC) and turns on updater artifacts.
          args: --config src-tauri/tauri.ci.conf.json ${{ matrix.args }}
